name: Refresh profile data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: write

concurrency:
  group: profile-data
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v5

      - name: Build recent repository list
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN || github.token }}
          GITHUB_USER: Lea9250
        run: python3 scripts/update_recent_repositories.py

      - name: Publish recent repository list
        run: |
          if git diff --quiet -- README.md; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Refresh recent repositories [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
